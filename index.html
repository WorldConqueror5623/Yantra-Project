<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Art Auction</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

  <style>
    /* --- STYLES (Modern Dark Mode) --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    /* Dashboard */
    .dashboard {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .price-display { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #22c55e; }
    .btn-connect { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    .btn-connect:hover { background: #2563eb; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); border-color: #38bdf8; }
    
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #0f172a;
    }
    .card h3 { font-size: 1rem; margin-bottom: 5px; color: #cbd5e1; display: flex; justify-content: space-between; }
    
    /* Buy Button */
    .btn-buy {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-buy:hover { background: #16a34a; }
    .btn-buy:disabled { background: #64748b; cursor: not-allowed; opacity: 0.5; }

    /* Sold State */
    .sold { opacity: 0.6; pointer-events: none; position: relative; }
    .sold::after {
      content: "SOLD";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      color: #ef4444;
      font-weight: 900;
      font-size: 2rem;
      border: 4px solid #ef4444;
      padding: 5px 10px;
      background: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>
<body>

  <h1>🎨 Student Art Auction</h1>

  <div class="dashboard">
    <div>
      <div style="color: #94a3b8; font-size: 0.9rem;">CURRENT PRICE</div>
      <div class="price-display" id="price">-- ETH</div>
    </div>
    <button class="btn-connect" onclick="connectWallet()" id="connectBtn">Connect Wallet</button>
  </div>

  <div class="grid" id="nftGrid"></div>

  <script>
    // -----------------------------------------------------------
    // 🔴 1. PASTE CONTRACT ADDRESS
    const CONTRACT_ADDRESS = "PASTE_YOUR_CONTRACT_ADDRESS_HERE"; 
    
    // 🔴 2. PASTE PINATA LINK (Must end with a slash /)
    // Example: "https://gateway.pinata.cloud/ipfs/QmXyZ123.../"
    const IPFS_BASE_URL = "PASTE_YOUR_PINATA_LINK_HERE/";
    // -----------------------------------------------------------

    const ABI = [
      "function getPrice() view returns (uint256)",
      "function buy(uint256 _id) payable",
      "function owners(uint256) view returns (address)",
      "function startAt() view returns (uint256)",
      "function ended() view returns (bool)"
    ];

    let provider, signer, contract;
    const TOTAL_ITEMS = 100; // MUST MATCH YOUR IMAGE COUNT

    async function connectWallet() {
      if (!window.ethereum) return alert("Please install MetaMask!");
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      
      const addr = await signer.getAddress();
      document.getElementById("connectBtn").innerText = addr.substring(0,6) + "...";
      document.getElementById("connectBtn").style.background = "#059669";
      
      contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
      
      checkAuctionStatus();
      setInterval(checkAuctionStatus, 1000); 
      renderGrid();
    }

    async function checkAuctionStatus() {
      if (!contract) return;
      try {
        const ended = await contract.ended();
        const startAt = await contract.startAt();
        
        if (ended) {
          document.getElementById("price").innerText = "ENDED";
          document.getElementById("price").style.color = "#ef4444";
          disableAllButtons(true);
        } else if (startAt.toNumber() === 0) {
          document.getElementById("price").innerText = "WAITING...";
          document.getElementById("price").style.color = "#f59e0b";
          disableAllButtons(true);
        } else {
          const priceWei = await contract.getPrice();
          const priceEth = ethers.utils.formatEther(priceWei);
          document.getElementById("price").innerText = parseFloat(priceEth).toFixed(4) + " ETH";
          
          // Update button prices
          document.querySelectorAll(".btn-buy").forEach(btn => {
             if (!btn.disabled && btn.innerText !== "MINING...") {
                 btn.innerText = `BUY @ ${parseFloat(priceEth).toFixed(4)}`;
             }
          });
          enableUnsoldButtons();
        }
      } catch (e) { console.error(e); }
    }

    async function renderGrid() {
      const grid = document.getElementById("nftGrid");
      grid.innerHTML = "";
      
      const promises = [];
      for (let i = 0; i < TOTAL_ITEMS; i++) {
        promises.push(contract.owners(i).then(owner => ({ id: i, owner })));
      }
      const results = await Promise.all(promises);

      results.forEach(item => {
        const isSold = item.owner !== "0x0000000000000000000000000000000000000000";
        
        // DIRECT LINK TO IMAGE - NO MYSTERY
        const imgUrl = `${IPFS_BASE_URL}${item.id}.png`;

        const card = document.createElement("div");
        card.className = isSold ? "card sold" : "card";
        
        card.innerHTML = `
            <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/200?text=Image+Error'">
            <h3>
                <span>Artwork #${item.id}</span>
            </h3>
            <button class="btn-buy" onclick="buyNFT(${item.id})" ${isSold ? 'disabled' : ''}>
                ${isSold ? 'SOLD' : 'WAITING...'}
            </button>
        `;
        grid.appendChild(card);
      });
    }

    async function buyNFT(id) {
      if (!contract) return;
      const btn = document.querySelectorAll(".btn-buy")[id];
      const oldText = btn.innerText;

      try {
        btn.innerText = "MINING...";
        btn.disabled = true;
        
        const price = await contract.getPrice();
        const tx = await contract.buy(id, { value: price });
        await tx.wait();
        
        alert("Success! You bought Artwork #" + id);
        location.reload(); 
      } catch (err) {
        console.error(err);
        alert("Error: " + (err.reason || err.message));
        btn.innerText = oldText;
        btn.disabled = false;
      }
    }

    function disableAllButtons(shouldDisable) {
        document.querySelectorAll(".btn-buy").forEach(btn => {
             if (!btn.closest('.card').classList.contains('sold')) {
                 btn.disabled = shouldDisable;
             }
        });
    }
    
    function enableUnsoldButtons() {
        document.querySelectorAll(".btn-buy").forEach(btn => {
             if (!btn.closest('.card').classList.contains('sold') && btn.innerText !== "MINING...") {
                 btn.disabled = false;
             }
        });
    }
  </script>
</body>
</html>
